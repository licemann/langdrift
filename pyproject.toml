[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "licemann-langdrift"
version = "0.1.0"
description = "按句统计输出所用语言，标出语言发生切换的位置与切换后占比"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "licemann" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://licemann.github.io"
Repository = "https://github.com/licemann/langdrift"
Issues = "https://github.com/licemann/langdrift/issues"

[project.scripts]
langdrift = "langdrift:main"

[tool.setuptools]
py-modules = ["langdrift"]
